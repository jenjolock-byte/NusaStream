name: NusaStream Preflight Simulation

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/simulate-nusastream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: Validate dependencies without producing an APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout upstream Stremio Android source
        uses: actions/checkout@v4
        with:
          repository: stremio-native/stremio-android
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Diagnose SDK package availability
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --list | tee /tmp/sdk-packages.txt
          grep -E "platforms;android-37|build-tools;37\.0\.0|ndk;29\.0\.13846066" /tmp/sdk-packages.txt || true

      - name: Install required SDK 37 and NDK
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13846066"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: upstream
        run: chmod +x ./gradlew

      - name: Simulation — validate Android dependency metadata and Kotlin compilation
        working-directory: upstream
        run: ./gradlew :app:checkDebugAarMetadata :app:compileDebugKotlin --no-daemon --warning-mode all

      - name: Simulation report
        if: success()
        run: echo "PREFLIGHT PASSED: SDK installation, Android dependency metadata, and Kotlin compilation succeeded. No APK was assembled."
