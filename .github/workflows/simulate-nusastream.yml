name: NusaStream Preflight Simulation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/simulate-nusastream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check Stremio Android source without building APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Stremio Android source
        uses: actions/checkout@v4
        with:
          repository: stremio-native/stremio-android
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK requirements
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13846066"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: upstream
        run: chmod +x ./gradlew

      - name: Run preflight compilation checks only
        working-directory: upstream
        run: ./gradlew :app:checkDebugAarMetadata :app:compileDebugKotlin --no-daemon --warning-mode all

      - name: Confirm no APK was assembled
        if: success()
        run: echo "PREFLIGHT PASSED. No APK was assembled."
